# Manifest automatisch auf das neueste zid-Release ziehen (checkver/autoupdate in
# bucket/zid.json): Scoops auto-pr lädt das Zip, rechnet den Hash und pusht hierher.
# Vorlage: ScoopInstaller/BucketTemplate.
name: Excavator

on:
  workflow_dispatch:
  schedule:
    # alle 4 Stunden
    - cron: '20 */4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
